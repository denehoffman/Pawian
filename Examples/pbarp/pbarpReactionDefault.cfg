errLogMode = debug
noOfThreads = 32
#errLogMode = trace
datFile    = /data/sleipnir1/bertram/pwaData/pbarpToKKpi/PWA_KKPI_1940.dat
mcFile     = /data/sleipnir1/bertram/pwaData/pbarpToKKpi/mcPWA_KKPI_1940.dat


#ratioMcToData = 10
ratioMcToData = 2
useEventWeight = true

paramFile  = ./defaultparams.dat
#paramFile  = ./finalResult.dat
#paramFile  = ./finalResultL3.dat


mode = qaMode
# Determines whether information about configuration options should be emitted
verbose = 1

mnParFix = J1P-1C-1L0S1pbarpPhi
mnParFix = J1P1C-1L1S0pbarpPhi

mnParFix = J1P-1C-1L1S1_J1P-1C-1Tophi_pion0Mag
mnParFix = J1P-1C-1L1S1_J1P-1C-1Tophi_pion0Phi
mnParFix = J1P1C-1L0S1_J1P1C-1Tophi_pion0Mag
mnParFix = J1P1C-1L0S1_J1P1C-1Tophi_pion0Phi
mnParFix = J2P-1C-1L1S1_J2P-1C-1Tophi_pion0Mag
mnParFix = J2P-1C-1L1S1_J2P-1C-1Tophi_pion0Phi
mnParFix = J3P-1C-1L3S1_J3P-1C-1Tophi_pion0Mag
mnParFix = J3P-1C-1L3S1_J3P-1C-1Tophi_pion0Phi
mnParFix = J0P-1C1L1S1_J0P-1C1ToK*KMag
mnParFix = J0P-1C1L1S1_J0P-1C1ToK*KPhi
mnParFix = J1P1C1L0S1_J1P1C1ToK*KMag
mnParFix = J1P1C1L0S1_J1P1C1ToK*KPhi
mnParFix = J2P-1C1L1S1_J2P-1C1ToK*KMag
mnParFix = J2P-1C1L1S1_J2P-1C1ToK*KPhi
mnParFix = J2P1C1L2S1_J2P1C1ToK*KMag
mnParFix = J2P1C1L2S1_J2P1C1ToK*KPhi

mnParFix = J1P-1C0L1S0_K*ToK_pion0Mag
mnParFix = J1P-1C0L1S0_K*ToK_pion0Phi
mnParFix = J1P-1C-1L1S0_phiToK+_K-Mag
mnParFix = J1P-1C-1L1S0_phiToK+_K-Phi
mnParFix = J0P1C0L0S0_K*0(1430)ToK_pion0Mag
mnParFix = J0P1C0L0S0_K*0(1430)ToK_pion0Phi


finalStateParticle = pion0
finalStateParticle = K+
finalStateParticle = K-

production = phi	pion0
production = K*+ K-
production = K*- K+
production = K*0(1430)+ K-
production = K*0(1430)- K+

decay = phi K+ K-
decay = K*+ K+ pion0
decay = K*- K- pion0	
decay = K*0(1430)+ K+ pion0	
decay = K*0(1430)- K- pion0

addDynamics = phi BreitWigner
addDynamics = K*+ BreitWigner
addDynamics = K*- BreitWigner
addDynamics = K*0(1430)+ BreitWigner
addDynamics = K*0(1430)- BreitWigner

replaceParamSuffix  = K*+_K- K*K
replaceParamSuffix  = K*-_K+ K*K
replaceParamSuffix  = K*+ToK+_pion K*ToK_pion
replaceParamSuffix  = K*-ToK-_pion K*ToK_pion

replaceParamSuffix  = K*0(1430)+_K- K*0(1430)K
replaceParamSuffix  = K*0(1430)-_K+ K*0(1430)K
replaceParamSuffix  = K*0(1430)+ToK+_pion K*0(1430)ToK_pion
replaceParamSuffix  = K*0(1430)-ToK-_pion K*0(1430)ToK_pion

replaceMassKey = K*+ K*
replaceMassKey = K*- K*
replaceMassKey = K*0(1430)+ K*0(1430)
replaceMassKey = K*0(1430)- K*0(1430)

histMass = K+ K-
histMass = K- pion0
histMass = K+ pion0

histAngles = pion0 from K+ K- pion0
histAngles = K+ from K+ K- pion0
histAngles = K- from K+ K- pion0
histAngles = K+ from K+ K-
histAngles = K+ from K+ pion0
histAngles = K- from K- pion0
 
pdgTableFile = /Examples/pbarp/bin/gcc-4.4.5/release/link-static/pdt.table
cacheAmps = true
lmax = 2
