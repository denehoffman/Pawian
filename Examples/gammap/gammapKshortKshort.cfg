# Example skeleton for gamma p -> X p, X -> Kshort Kshort.
# The beam photon and target proton are configured by the channel; the ASCII
# event rows contain only these final-state particles, in this order.
noOfThreads = 1
errLogMode = info

datFile = ./Examples/gammap/laddu_compare/generated/ksks_data.txt
mcFile = ./Examples/gammap/laddu_compare/generated/ksks_mc.txt
unitInFile = GEV
orderInFile = Px Py Pz E

ratioMcToData = 3
useDataEventWeight = false
useMCEventWeight = false

paramFile = ./ksks_startParams.dat
mode = pwa
verbose = 1

productionFormalism = Cano

# Fixed linear photon beam polarization for this data file.
# Angle is in radians in the convention used by GammapBeamPolarization.
beamPolFraction = 0.3519
beamPolAngle = 0.0

cloneParticle = Kshort Kshort1
cloneParticle = Kshort Kshort2

finalStateParticle = proton
finalStateParticle = Kshort1
finalStateParticle = Kshort2

# These are ordinary Pawian resonance waves today. A reflectivity-basis
# production formalism should map these to names such as S0+, S0-, and D2+.
production = f0(1500) proton
production = f2'(1525) proton

decay = Cano f0(1500) To Kshort1 Kshort2
decay = Cano f2'(1525) To Kshort1 Kshort2

histMass = Kshort1 Kshort2
histMass = proton Kshort1 Kshort2
histAngles = Kshort1 from Kshort1 Kshort2
histAngles = proton from proton Kshort1 Kshort2

pdgTableFile = /Particle/pdtNew.table
cacheAmps = true
lmax = 3
