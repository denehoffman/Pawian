.only-default: &only-default
  only:
    - merge_requests
    - master

.print-system-info: &print-system-info
  - lsb_release -a
  - pwd
  - clang++ --version
  - g++ --version
  - git --version

.activate-venv: &activate-venv
  - python3 -m venv venv
  - source venv/bin/activate
  - python3 -m pip install --upgrade pip
  - python3 -m pip install wheel
  - which python3

before_script:
  - *print-system-info
  - touch Jamroot
  - source SetEnv_rub.sh

b2, g++ 9.2.0:
  <<: *only-default
  script:
    - bjam release -j$(nproc)

b2, clang 8.0.1:
  <<: *only-default
  script:
    - bjam release toolset=clang -j$(nproc)

Documentation:
  <<: *only-default
  before_script:
    - *print-system-info
    - *activate-venv
    - python3 -m pip install .[doc]
  script:
    - cd doc
    - make html
